[package]
name = "myelin-eval"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license.workspace = true

[features]
# Pins `coverage` against the measured M19 run directories. Off by default
# because `runs/**/per_question.jsonl` and `/data/` are both gitignored: the
# artifacts live on the measurement host, not in a clean checkout.
artifacts = []

[lib]
name = "myelin_eval"
path = "src/lib.rs"

[[bin]]
name = "myelin-eval"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
uuid = { workspace = true }
myelin-core = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }


[dev-dependencies]
tempfile = { workspace = true }