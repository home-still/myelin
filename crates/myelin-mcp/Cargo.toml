[package]
name = "myelin-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license.workspace = true

[features]
# Opts in the tests that talk to a live Qdrant. Off by default so
# `cargo test --workspace` stays hermetic.
integration = []

[lib]
name = "myelin_mcp"
path = "src/lib.rs"

[[bin]]
name = "myelin-mcp"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
myelin-core = { workspace = true }
qdrant-client = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
# The integration tests speak MCP to the server in-process, as a client does.
rmcp = { workspace = true, features = ["client"] }
