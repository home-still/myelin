[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
# Matches the root `LICENSE` (MIT, Copyright (c) 2026 Home Still). Declared
# here so `cargo package`, `cargo publish` and every SBOM see it.
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
figment = { version = "0.10", features = ["yaml", "env"] }
futures-util = "0.3"
petgraph = "0.8"
qdrant-client = { version = "1.19", features = ["serde"] }
# Snowball English (Porter's suffix stripping), for M81's question-word match:
# "bake" meets "baked" (`myelin_eval::bench::uncited_terms`).
rust-stemmers = "1.2"
# The gRPC status type qdrant-client's errors carry, named so a transport
# failure can be told from an API error (`store::qdrant::is_transient`). The same
# major as qdrant-client's own tonic, so the types unify.
tonic = { version = "0.14", default-features = false }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots"], default-features = false }
rmcp = { version = "3.3", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a schema's `properties` reach llama.cpp in source order, and
# llama.cpp generates fields in that order. Without it serde_json sorted every
# object's keys, so no schema's intended order ever reached the model
# (docs/measurements/defect-2026-09-28-schema-field-order.md).
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "macros"], default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

proptest = "1"
tempfile = "3"

sha2 = "0.10"
myelin-core = { path = "crates/myelin-core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
